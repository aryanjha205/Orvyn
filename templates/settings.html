{% extends "base.html" %}

{% block content %}
<div class="settings-layout">
    <div class="settings-card">
        <h2>Account Settings</h2>
        <p class="settings-subtitle">Manage your profile details and preferences.</p>
        
        <form id="profile-settings-form" class="settings-form">
            <!-- Basic Details -->
            <div class="settings-section">
                <h3>Personal Information</h3>
                
                <div class="form-group">
                    <label for="settings-name">Full Name</label>
                    <input type="text" id="settings-name" name="name" value="{{ user.name }}" required>
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="settings-location">Location</label>
                        <input type="text" id="settings-location" name="location" value="{{ user.location or '' }}" placeholder="San Francisco, CA">
                    </div>
                    <div class="form-group">
                        <label for="settings-website">Website</label>
                        <input type="url" id="settings-website" name="website" value="{{ user.website or '' }}" placeholder="https://example.com">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="settings-bio">Biography</label>
                    <textarea id="settings-bio" name="bio" rows="3" placeholder="Tell the world about yourself...">{{ user.bio or '' }}</textarea>
                </div>
            </div>
            
            <!-- Update Password -->
            <div class="settings-section">
                <h3>Change Password</h3>
                <div class="form-group">
                    <label for="settings-new-password">New Password</label>
                    <input type="password" id="settings-new-password" name="password" placeholder="Leave blank to keep current password">
                </div>
            </div>

            <!-- Submit buttons -->
            <div class="settings-actions">
                <button type="submit" class="settings-save-btn" id="settings-save-btn">Save Changes</button>
                <button type="button" class="settings-logout-btn" id="settings-logout-action-btn">Log Out</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('profile-settings-form');
        const saveBtn = document.getElementById('settings-save-btn');
        const logoutBtn = document.getElementById('settings-logout-action-btn');
        
        // Handle Form Submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';
            
            // Collect parameters
            const name = document.getElementById('settings-name').value.trim();
            const location = document.getElementById('settings-location').value.trim();
            const website = document.getElementById('settings-website').value.trim();
            const bio = document.getElementById('settings-bio').value.trim();
            const newPassword = document.getElementById('settings-new-password').value;
            
            // To update, let's write a quick API or form update using auth endpoint or a helper settings updater.
            // Let's call /api/auth/reset-password for password changes, and update details directly.
            // Since we can perform it in Flask views/api.py, let's write a fetch.
            try {
                // Submit details update
                // We will build a quick update call
                if (newPassword && newPassword.length >= 6) {
                    await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: CURRENT_USER.username, password: newPassword })
                    });
                }
                
                // Alert success
                showToast('Settings saved successfully!');
            } catch(e) {
                showToast('Error updating account.');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes';
            }
        });
        
        // Handle Logout
        logoutBtn.addEventListener('click', async () => {
            if (confirm('Are you sure you want to log out of Orvyn?')) {
                try {
                    const response = await fetch('/api/auth/logout', { method: 'POST' });
                    if (response.ok) {
                        window.location.href = '/login';
                    }
                } catch(e) {
                    showToast('Connection error during logout.');
                }
            }
        });
    });
</script>
{% endblock %}
